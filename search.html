<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Hospitals</title>
  <link rel="stylesheet" href="search-styles.css">
  <style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: linear-gradient(120deg, #89f7fe, #66a6ff);
        color: #333;
        text-align: center;
      }
      .container {
        padding: 20px;
        max-width: 600px;
        margin: 50px auto;
        background: white;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
      h1 {
        font-size: 2.5rem;
        color: #007BFF;
      }
      p {
        font-size: 1.2rem;
        margin-bottom: 20px;
      }
      .dropdown {
        margin: 10px 0;
      }
      select {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        font-size: 1rem;
        border: 1px solid #ddd;
        border-radius: 5px;
        background-color: #f9f9f9;
      }
      .button {
        padding: 10px 20px;
        background: #007BFF;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 1rem;
        transition: background 0.3s ease;
      }
      .button:hover {
        background: #0056b3;
      }
    
  </style>
</head>
<body>

  <h1>Find the Right Care for <span id="selected-disease"></span></h1>
  <p>We’ve got you covered! Select your location to filter the hospitals.</p>
  <script>
    // Extract the disease from the URL query parameters
    const urlParams = new URLSearchParams(window.location.search);
    const selectedDisease = urlParams.get('disease');

    // Update the webpage to display the selected disease
    document.getElementById('selected-disease').textContent = selectedDisease || "a specific disease";

    function redirectToLocationSelection() {
      if (selectedDisease) {
        // Redirect to the location selection page with the selected disease
        window.location.href = `location.html?disease=${encodeURIComponent(selectedDisease)}`;
      } else {
        alert("Please select a disease first!");
      }
    }
  </script>
  <div class="dropdown-container">
    <label for="country">Country:</label>
    <select id="country" onchange="populateStates()">
      <option value="" disabled selected>🌍 Select a country</option>
    </select>

    <label for="state">State:</label>
    <select id="state" onchange="populateDistricts()">
      <option value="" disabled selected>🏘️ Select a state</option>
    </select>

    <label for="district">District:</label>
    <select id="district" onchange="showHospitalButtons()">
      <option value="" disabled selected>Select a district</option>
    </select>
  </div>
 
  <button onclick="redirectToHospitals()">Find Hospitals</button>
  <div id="hospital-buttons"></div>
  <div id="hospital-cards"></div>
  <button onclick="goBack()">Back</button>
  <script src="search.js"></script>

  
</body>
</html>
