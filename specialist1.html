<!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Specialist Cards</title>
      <link rel="stylesheet" href="mini.css">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap');
    
    /* root color  */
    :root{
      --blue:#0188df;
      --black:#444d53;
      --wight:#fff;
    }
    
    /* custom css  */
    *{
      font-family: "Roboto", sans-serif;
      margin: 0; padding: 0;
      text-decoration: none;
      text-transform: capitalize;
      outline: none;
      box-sizing: border-box;
      transition: all linear .2s;
    }
    
    html{
      font-size: 62.5%;
      overflow-x: hidden;
    }
    header{
      width: 96%;
      background: var(--wight);
      position:fixed;
      top: 2rem;
      left: 50%;
      transform: translate(-50%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      z-index: 1000;
      margin-bottom: 20px;
      padding-bottom: 20px;
    }
    
    /* logo name  */
    header a{
      color: var(--black);
    }
    
    header a:hover{
      color: var(--blue);
    }
    
    header .logo{
      font-size: 3rem;
    }
    
    header .logo span{
      color: var(--blue);
    }
    
    /* navbar link  */
    header .navbar ul{
      display: flex;
      align-items: center;
      justify-content: space-between;
      list-style: none;
    }
    
    header .navbar ul li{
      margin: 0 1rem;
    }
    
    header .navbar ul li a{
      font-size: 2rem;
      color: var(--black);
    }
    
    header .navbar ul li a:hover{
      color: var(--blue);
    }
    
    header .fa-bars{
      font-size: 3rem;
      color: var(--blue);
      cursor: pointer;
      display: none;
    }
    body, h1, h2, p {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }
      
      body {
        background-color: #f3f4f6;
        color: #1f2937;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin-top: 20px;
        padding-top: 20px;
      }
      
      .container {
        max-width: 1200px;
        margin: 20px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        margin-top: 20px;
    
      }
      
      /* Specialist Card */
      .card {
        background-color: white;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        transition: transform 0.2s ease-in-out;
        text-align: center;
      }
      
      .card:hover {
        transform: scale(1.05);
        background-color: #f1f5f9;
      }
      
      .card img {
        width: 100%;
        height: 200px;
        object-fit: cover;
      }
      
      .card h3 {
        margin: 10px 0;
        font-size: 1.5rem;
        color: #1f2937;
      }
      
      .card p {
        margin: 10px 20px;
        font-size: 1rem;
        color: #4b5563;
      }
      
      /* Back Button */
      .back-button {
        margin-top: 20px;
        background-color: #3b82f6;
        color: white;
        border: none;
        padding: 10px 20px;
        font-size: 1rem;
        border-radius: 5px;
        cursor: pointer;
      }
      
      .back-button:hover {
        background-color: #2563eb;
      }
      </style>
    </head>
    <body>
      
      <header>
    
        <!-- logo name  -->
        <a href="#" class="logo"><span>E</span>mergency <span>H</span>ospital <span>S</span>earch <span>A</span>ssistant</a>
    
        <!-- navbar link  -->
        <nav class="navbar">
            <ul>
                <li><a href="login">Login</a></li>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#offerings">offerings</a></li>
                <li><a href="#blog">Blog</a></li>
                <li><a href="#contact">contact</a></li>
            </ul>
        </nav>
    
        <div class="fas fa-bars"></div>
    </header>
    
    
    <div id="app" class="container"></div>
      <script src="script.js"></script>
    </body>
    </html>
